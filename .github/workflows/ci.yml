name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run compile

      # VS Code's extension test runner needs a display.
      - name: Run extension tests
        uses: coactions/setup-xvfb@v1
        with:
          run: npm test

      - run: npm audit --audit-level=high

  # See docs/process/DEFINITION_OF_DONE.md: a codegen template change isn't
  # proven by its own unit tests alone — the generated project must build.
  # Lands with Epic 7; a no-op until examples/ has something to build.
  golden-project-build:
    runs-on: ubuntu-latest
    if: false # enable once Epic 7 lands a generated project in examples/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - run: cd examples/golden-project && ./gradlew test
